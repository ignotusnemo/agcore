[package]
name = "agcore"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Agent Core: independent Parano1d State and receipt verification"
build = "upstream/parano1d/noid_node/build.rs"

[workspace]
members = ["."]
exclude = ["upstream/parano1d", "upstream/parano1d/*"]
resolver = "2"

# Preserve the metadata and shared dependency settings of the pinned native crates.
[workspace.package]
version = "2.0.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[features]
default = []
isolated-v2-fork-testnet = ["noid_chain/isolated-v2-fork-testnet", "noid_chain/isolated-v1-1-testnet"]
retired-history = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
futures = "0.3"
rayon = "1"
blake3 = "1"
bincode = "1"
libp2p = { version = "0.55", features = ["tokio", "tcp", "noise", "yamux", "gossipsub"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
noid_core = { path = "upstream/parano1d/noid_core" }
noid_chain = { path = "upstream/parano1d/noid_chain" }
noid_block = { path = "upstream/parano1d/noid_block" }
noid_tx = { path = "upstream/parano1d/noid_tx" }
noid_poseidon2b = { path = "upstream/parano1d/noid_poseidon2b" }
noid_recursive = { path = "upstream/parano1d/noid_recursive" }
noid_miner = { path = "upstream/parano1d/noid_miner" }
noid_mempool = { path = "upstream/parano1d/noid_mempool" }
noid_p2p = { path = "upstream/parano1d/noid_p2p" }
noid-ivc-core = { path = "upstream/parano1d/noid_ivc_core" }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
libc = "0.2"

[build-dependencies]
noid_chain = { path = "upstream/parano1d/noid_chain" }
noid_recursive = { path = "upstream/parano1d/noid_recursive" }
noid_miner = { path = "upstream/parano1d/noid_miner" }
noid-ivc-core = { path = "upstream/parano1d/noid_ivc_core" }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
libmdbx = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release.build-override]
opt-level = 3
codegen-units = 1
